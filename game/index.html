<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Skyline: fly a chase-camera approach over a grid landscape and land on the runway. A small Canvas 2D flight game.">
<title>Skyline — a flight challenge</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a1422; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Skyline: a flight game. Fly over a gridded landscape, bank and pitch the aircraft, and line up with the runway to land. Pitch with W and S, roll with A and D, hold Space for throttle."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
